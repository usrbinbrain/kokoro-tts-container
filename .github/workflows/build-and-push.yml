name: Build and Push usrbinbrain/kokoro-tts-container

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Requirements Install
        run: python -m pip install -r requirements.txt

      - name: Run Setup Script
        run: python setup.py

      - name: Setup Docker Login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Run Build Docker Image
        run: docker build -t usrbinbrain/kokoro-tts-container:latest .

      - name: Run Push Docker Image
        run: docker push usrbinbrain/kokoro-tts-container:latest
